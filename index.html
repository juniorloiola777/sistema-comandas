<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#8d0c14" />
<link rel="manifest" href="/manifest.json" />
<title>Comanda — Garçom</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body data-page="waiter">
<section id="waiterView" class="app waiter-shell">
  <header class="waiter-head">
    <div class="brand"><div><small></small><h1>COMANDA</h1></div><div class="brand-badge">Garçom</div></div>
    <div class="user-pill"><span>👤 Usuário: <strong id="waiterNameLabel">Garçom 01</strong></span><span>● online</span></div>
    <div class="live-mini"><span class="live-dot"></span><span id="waiterLiveText">Conectando...</span></div>
  </header>
  <main class="content">
    <div class="mobile-title-row"><div><div class="eyebrow">ATENDIMENTO</div><h2 class="screen-title">Mesas</h2></div></div>
    <div class="search"><input id="searchTable" placeholder="Mesa ou nome do cliente"/><button id="searchBtn">Buscar</button></div>
    <div class="action-row"><button class="primary" id="newTable">＋ Abrir mesa</button><button id="newTab">＋ Comanda individual</button></div>
    <div class="legend"><span><i class="dot" style="background:#1fa34a"></i>Livre</span><span><i class="dot" style="background:#d91e2b"></i>Ocupada</span><span><i class="dot" style="background:#f59e0b"></i>Fechamento</span></div>
    <div id="tableGrid" class="table-grid"></div>
  </main>
  <div class="bottom-nav">
    <button class="active" id="bottomTables">▦<br>Mesas</button>
    <button id="bottomSearch">⌕<br>Buscar</button>
    <button id="bottomTabs">⚙<br>Ajustes</button>
  </div>
</section>

<div id="overlay" class="overlay hidden"><div class="sheet"><div class="sheet-head"><h3 id="sheetTitle">Nova comanda</h3><button class="x" id="closeSheet">×</button></div><div class="sheet-body">
  <div class="client-line"><input id="clientName" placeholder="Nome do cliente"/><select id="tableSelect"></select></div>
  <div id="categoryChips" class="chips"></div>
  <div id="productsGrid" class="products"></div>
  <div class="cart"><h4>Pedido</h4><div id="cartLines"></div><div class="cart-total"><span>Total</span><span id="cartTotal">R$ 0,00</span></div><button class="confirm" id="confirmOrder">Lançar pedido</button><button class="request-close hidden" id="requestClose">Solicitar fechamento</button></div>
</div></div></div>

<div id="toast" class="toast hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/app.js"></script>
</body>
</html>
